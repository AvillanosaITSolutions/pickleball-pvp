services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wallofanger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./api/.env
    ports:
      - "4000:4000"

  colyseus:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "2567"
    ports:
      - "2567:2567"

  # Optional: front-end served by nginx (built separately)
  # web:
  #   build: .
  #   ports: ["80:80"]

volumes:
  pgdata:
